<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Allure PDF Exporter</title>
    <style>
        :root { color-scheme: light; font-family: Georgia, "Times New Roman", serif; background: #f4f0e8; color: #18211f; }
        body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 90% 10%, #d6e4d5 0 18%, transparent 42%), #f4f0e8; }
        main { width: min(720px, calc(100% - 40px)); margin: 0 auto; padding: 12vh 0; }
        .eyebrow { font: 700 12px/1.2 Arial, sans-serif; letter-spacing: 2px; text-transform: uppercase; color: #bd5d3d; }
        h1 { max-width: 560px; margin: 18px 0 14px; font-size: clamp(42px, 8vw, 76px); line-height: .95; font-weight: 400; }
        p { max-width: 520px; margin: 0 0 36px; font: 18px/1.55 Arial, sans-serif; color: #52605a; }
        form { display: flex; gap: 10px; align-items: stretch; }
        input { min-width: 0; flex: 1; border: 1px solid #aeb9ae; border-radius: 4px; padding: 16px; background: #fffdf8; font: 16px Arial, sans-serif; }
        button { border: 0; border-radius: 4px; padding: 0 22px; background: #bd5d3d; color: white; cursor: pointer; font: 700 14px Arial, sans-serif; }
        button:disabled { opacity: .55; cursor: wait; }
        #status { min-height: 28px; margin-top: 22px; font: 15px/1.5 Arial, sans-serif; }
        a { color: #bd5d3d; font-weight: 700; }
        @media (max-width: 600px) { main { padding-top: 72px; } form { flex-direction: column; } button { min-height: 52px; } }
    </style>
</head>
<body>
    <main>
        <div class="eyebrow">Allure → PDF</div>
        <h1>Turn a report URL into a document.</h1>
        <p>Paste the address of a published Allure report. The exporter will collect its key sections and assemble one downloadable PDF.</p>
        <form id="report-form">
            <input id="url" name="url" type="url" placeholder="https://your-allure-report.example.com/" required>
            <button id="submit" type="submit">Generate PDF</button>
        </form>
        <div id="status" role="status" aria-live="polite"></div>
    </main>
    <script>
        const form = document.querySelector("#report-form");
        const input = document.querySelector("#url");
        const button = document.querySelector("#submit");
        const status = document.querySelector("#status");

        form.addEventListener("submit", async event => {
            event.preventDefault();
            button.disabled = true;
            status.textContent = "Generating report... This can take a minute. Please do not refresh or close the page.";

            try {
                const response = await fetch("/api/reports", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ url: input.value.trim() })
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || "Generation failed.");
                status.innerHTML = `<a href="${result.downloadUrl}">Download your PDF</a>`;
            } catch (error) {
                status.textContent = error.message;
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
